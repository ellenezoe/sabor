<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produto - Painel Administrativo</title>
    <!-- Google Fonts & Material Icons -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
     <link href="./estilo.css" rel="stylesheet">
    <style>
        /* =========================================================
           VARIÁVEIS (Referência do seu design system)
           ========================================================= */
        :root {
            --verde: #31511f;
            --verde-escuro: #203817;
            --verde-medio: #4d702b;
            --verde-claro: #edf5e8;
            --lima: #a8df65;
            --creme: #f8f7f1;
            --branco: #ffffff;
            --texto: #24331d;
            --texto-claro: #687261;
            --borda: #dce7d3;
            --sombra: 0 10px 30px rgba(27, 48, 20, 0.10);
            --sombra-forte: 0 18px 45px rgba(15, 35, 10, 0.20);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            color: var(--texto);
            font-family: "DM Sans", Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
            position: relative;
            background: url("https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=1600&q=80") center / cover no-repeat fixed;
        }

        /* Overlay translúcido de hortaliças conforme solicitado */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg,
                rgba(20, 52, 15, 0.91),
                rgba(49, 81, 31, 0.82));
            z-index: 1;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        /* =========================================================
           CONTAINER DO FORMULÁRIO DE CADASTRO
           ========================================================= */
        .cadastro-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 680px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            padding: 42px;
            border-radius: 22px;
            box-shadow: var(--sombra-forte);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .cadastro-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .cadastro-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background-color: #e3f0d7;
            color: var(--verde-medio);
            margin-bottom: 14px;
            box-shadow: 0 4px 12px rgba(77, 112, 43, 0.15);
        }

        .cadastro-icon i {
            font-size: 28px;
        }

        .cadastro-header h2 {
            margin: 0 0 6px;
            color: var(--verde-escuro);
            font-family: Arial, Helvetica, sans-serif;
            font-size: 2.1rem;
            font-weight: 800;
        }

        .cadastro-header p {
            margin: 0;
            color: var(--texto-claro);
            font-size: 0.96rem;
        }

        /* Estrutura de Grades e Campos */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: var(--texto);
            font-size: 0.88rem;
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        .form-group input[type="text"],
        .form-group input[type="file"] {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            border: 1px solid var(--borda);
            border-radius: 10px;
            background-color: var(--creme);
            color: var(--texto);
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-group input[type="file"] {
            padding: 10px;
            background-color: var(--branco);
            cursor: pointer;
            font-size: 0.86rem;
        }

        .form-group input[type="text"]:focus {
            border-color: var(--verde-medio);
            background-color: var(--branco);
            box-shadow: 0 0 0 3px rgba(77, 112, 43, 0.15);
        }

        /* Botão de Envio (Estilo .btn-full do seu CSS) */
        .btn-full {
            width: 100%;
            height: 50px;
            margin-top: 10px;
            border: 0;
            border-radius: 10px;
            background-color: var(--lima);
            color: var(--verde-escuro);
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: var(--sombra);
            transition: filter 0.2s ease, transform 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-full:hover {
            background-color: #96cd56;
            filter: brightness(0.96);
            transform: translateY(-1px);
        }

        /* Responsividade para telas menores */
        @media (max-width: 650px) {
            .cadastro-container {
                padding: 24px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .cadastro-header h2 {
                font-size: 1.7rem;
            }
        }
    </style>
</head>

<body>

    <div class="cadastro-container">
        <div class="cadastro-header">
            <div class="cadastro-icon">
                <i class="material-icons">eco</i>
            </div>
            <h2>Cadastro de Produtos</h2>
            <p>Adicione um novo item fresco ao catálogo do hortifrúti.</p>
        </div>

        <form id="formProduto" enctype="multipart/form-data">
            
            <div class="form-group">
                <label for="name">Nome do Produto</label>
                <input id="name" type="text" name="name" placeholder="Ex: Alface Crespa Orgânica" required>
            </div>

            <div class="form-group">
                <label for="image">Imagem do Produto</label>
                <input type="file" id="image" name="image" accept="image/*" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="category">Categoria do Produto</label>
                    <input id="category" type="text" name="category" placeholder="Ex: Hortaliças" required>
                </div>

                <div class="form-group">
                    <label for="categoryLabel">Label do Produto</label>
                    <input id="categoryLabel" type="text" name="categoryLabel" placeholder="Ex: Orgânico" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="unit">Unidade de Medida</label>
                    <input id="unit" type="text" name="unit" placeholder="Ex: Unidade (aprox. 300g)" required>
                </div>

                <div class="form-group">
                    <label for="badge">Etiqueta de Destaque</label>
                    <input id="badge" type="text" name="badge" placeholder="Ex: Fresco Hoje" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="price">Preço Atual (R$)</label>
                    <input id="price" type="text" name="price" placeholder="R$ 3,99" required>
                </div>

                <div class="form-group">
                    <label for="oldPrice">Preço Antigo (R$)</label>
                    <input id="oldPrice" type="text" name="oldPrice" placeholder="R$ 4,99" required>
                </div>
            </div>

            <button type="submit" class="btn-full">
                <i class="material-icons">add_circle_outline</i> Cadastrar Produto
            </button>
        </form>
    </div>

    <script src="./product.js"></script>
</body>

</html>
